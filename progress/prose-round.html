<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="20">
<title>ITP prose refactor, live progress</title>
<link rel="stylesheet" href="../styles/tokens.css">
<style>
  body { background: var(--navy-950); color: var(--on-navy); }
  .page { max-width: 1180px; margin-inline: auto; padding: var(--sp-9) var(--sp-gutter) var(--sp-12); }

  .masthead { display: grid; gap: var(--sp-4); padding-bottom: var(--sp-7);
              border-bottom: 1px solid var(--line-navy); }
  .masthead h1 { font-size: clamp(1.9rem, 3.6vw, 3rem); letter-spacing: var(--ls-display-tight); }
  .masthead .t-lead { color: var(--on-navy-soft); max-width: 68ch; }
  .meta { display: flex; flex-wrap: wrap; gap: var(--sp-6); align-items: center;
          font-family: var(--font-mono); font-size: var(--t-micro);
          letter-spacing: var(--ls-mono-wide); text-transform: uppercase;
          color: var(--on-navy-muted); }
  .meta b { color: var(--cyan); font-weight: var(--w-bold); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan);
           box-shadow: 0 0 0 0 var(--cyan-glow); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,207,255,.5); }
                     70% { box-shadow: 0 0 0 12px rgba(0,207,255,0); }
                     100% { box-shadow: 0 0 0 0 rgba(0,207,255,0); } }

  h2.block { font-size: var(--t-display-4); margin: var(--sp-11) 0 var(--sp-5); }
  h2.block .index-num { color: var(--cyan-soft); margin-right: var(--sp-3); }

  table.board { width: 100%; border-collapse: collapse; }
  table.board th, table.board td { text-align: left; vertical-align: top;
                                   padding: var(--sp-4) var(--sp-4);
                                   border-bottom: 1px solid var(--line-navy); }
  table.board thead th { font-family: var(--font-mono); font-size: var(--t-micro);
                         font-weight: var(--w-bold); letter-spacing: var(--ls-mono-wide);
                         text-transform: uppercase; color: var(--on-navy-muted);
                         border-bottom-color: var(--line-navy-hi); }
  table.board td:first-child { width: 22%; }
  .piece-title { font-weight: var(--w-black); letter-spacing: var(--ls-head); font-size: 1.05rem; }
  .piece-file { font-family: var(--font-mono); font-size: var(--t-micro);
                color: var(--on-navy-muted); letter-spacing: .04em; }
  .scope { font-size: var(--t-body-sm); color: var(--on-navy-soft); line-height: 1.5; }
  .note { font-size: var(--t-body-sm); color: var(--on-navy-soft); line-height: 1.55; }
  .gap { display: block; margin-top: var(--sp-3); padding-left: var(--sp-4);
         border-left: 2px solid var(--f3-inflam); font-size: var(--t-caption);
         color: var(--on-navy-soft); }
  .gap b { color: var(--f3-inflam); font-family: var(--font-mono);
           font-size: var(--t-micro); letter-spacing: var(--ls-mono-wide);
           text-transform: uppercase; display: block; margin-bottom: 3px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
           border-radius: var(--r-pill); border: 1px solid var(--line-navy-hi);
           font-family: var(--font-mono); font-size: var(--t-micro);
           font-weight: var(--w-bold); letter-spacing: var(--ls-mono);
           text-transform: uppercase; white-space: nowrap; }
  .badge--building { color: var(--cyan); border-color: var(--line-cyan);
                     background: rgba(0,207,255,.08); }
  .badge--reviewing { color: var(--f1-digest); border-color: rgba(229,148,60,.45);
                      background: rgba(229,148,60,.10); }
  .badge--lost { color: var(--f3-inflam); border-color: rgba(242,99,90,.45);
                 background: rgba(242,99,90,.10); }
  .badge--won { color: var(--f4-vital); border-color: rgba(0,195,154,.5);
                background: rgba(0,195,154,.12); }
  .rnd { font-family: var(--font-mono); font-size: var(--t-micro);
         color: var(--on-navy-faint); letter-spacing: var(--ls-mono); }

  ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-4); }
  .found { display: grid; grid-template-columns: 22px 1fr; gap: var(--sp-4);
           align-items: start; }
  .found__tick { color: var(--cyan); font-family: var(--font-mono); font-weight: var(--w-bold); }
  .found__label { font-weight: var(--w-bold); letter-spacing: var(--ls-head); }
  .found__detail { font-size: var(--t-body-sm); color: var(--on-navy-soft); line-height: 1.5; }

  .rules { display: grid; gap: var(--sp-3); }
  .rules li { padding-left: var(--sp-4); border-left: 2px solid var(--cyan);
              font-size: var(--t-body-sm); color: var(--on-navy-soft); line-height: 1.55; }

  .log { display: grid; gap: 0; }
  .log li { display: grid; grid-template-columns: 64px 1fr; gap: var(--sp-4);
            padding: var(--sp-3) 0; border-bottom: 1px solid var(--line-navy);
            font-size: var(--t-body-sm); color: var(--on-navy-soft); }
  .log time { font-family: var(--font-mono); font-size: var(--t-micro);
              color: var(--cyan-soft); letter-spacing: var(--ls-mono); padding-top: 3px; }

  .tally { display: flex; flex-wrap: wrap; gap: clamp(20px,3vw,44px); margin-top: var(--sp-7);
           padding-top: var(--sp-6); border-top: 1px solid var(--line-navy-hi); }

  .links { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-6); }
  .links a { text-decoration: none; }

  table.metrics { width: 100%; border-collapse: collapse; font-family: var(--font-mono);
                  font-size: var(--t-micro); letter-spacing: .02em; }
  table.metrics th, table.metrics td { text-align: right; padding: 7px 9px;
                                       border-bottom: 1px solid var(--line-navy); }
  table.metrics th:first-child, table.metrics td:first-child { text-align: left; }
  table.metrics thead th { color: var(--on-navy-muted); text-transform: uppercase;
                           font-weight: var(--w-bold); border-bottom-color: var(--line-navy-hi); }
  table.metrics tr.bar td { color: var(--cyan); border-bottom-color: var(--line-cyan); }
  table.metrics tr.total td { color: var(--on-navy); font-weight: var(--w-bold); }
  .ok { color: var(--f4-vital); }
  .bad { color: var(--f3-inflam); }
  .metric-note { font-size: var(--t-caption); color: var(--on-navy-soft);
                 line-height: 1.55; margin-top: var(--sp-4); max-width: 74ch; }

  @media (max-width: 820px) {
    table.board thead { display: none; }
    table.board tr { display: grid; gap: var(--sp-3); padding: var(--sp-5) 0;
                     border-bottom: 1px solid var(--line-navy); }
    table.board td { border: 0; padding: 0; }
    table.board td:first-child { width: auto; }
  }
</style>
</head>
<body class="navy">
<main class="page">

  <header class="masthead">
    <p class="eyebrow">Live progress · auto-refresh 20 s</p>
    <h1 id="campaign">…</h1>
    <p class="t-lead" id="bar">…</p>
    <div class="meta">
      <span class="pulse" aria-hidden="true"></span>
      <span>Round <b id="round">&hellip;</b></span>
      <span id="phase">&hellip;</span>
      <span>Updated <b id="updated">&hellip;</b></span>
    </div>
  </header>

  <section aria-labelledby="h-board">
    <h2 class="block" id="h-board"><span class="index-num">01</span>The board</h2>
    <table class="board">
      <thead>
        <tr><th scope="col">Piece</th><th scope="col">Scope</th><th scope="col">Status</th><th scope="col">Critic</th></tr>
      </thead>
      <tbody id="board"></tbody>
    </table>
    <div class="tally" id="tally"></div>
    <div class="links" id="links"></div>
  </section>

  <section aria-labelledby="h-found">
    <h2 class="block" id="h-found"><span class="index-num">02</span>Foundation</h2>
    <ul class="plain" id="foundation"></ul>
  </section>

  <section aria-labelledby="h-rules">
    <h2 class="block" id="h-rules"><span class="index-num">03</span>Standing rules</h2>
    <ul class="plain rules" id="rules"></ul>
  </section>

  <section aria-labelledby="h-log">
    <h2 class="block" id="h-log"><span class="index-num">04</span>Log</h2>
    <ul class="plain log" id="log"></ul>
  </section>

  <section aria-labelledby="h-metrics">
    <h2 class="block" id="h-metrics"><span class="index-num">05</span>The meter</h2>
    <table class="metrics">
      <thead>
        <tr><th scope="col">Corpus</th><th scope="col">Words</th><th scope="col">Em/1k</th>
            <th scope="col">Dash/1k</th><th scope="col">Banned</th><th scope="col">Soft/1k</th>
            <th scope="col">Mean</th><th scope="col">SD</th><th scope="col">Colon%</th>
            <th scope="col">Opener%</th><th scope="col">EMD</th><th scope="col">Gate</th></tr>
      </thead>
      <tbody id="metrics"></tbody>
    </table>
    <p class="metric-note" id="metric-note"></p>
  </section>

</main>

<script src="state.js"></script>
<script src="metrics.js"></script>
<script>
(function () {
  var S = window.ITP_STATE;
  if (!S) return;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  $('campaign').textContent = S.campaign;
  $('bar').textContent = 'Bar: ' + S.bar;
  $('round').textContent = S.round;
  $('phase').textContent = S.phase;
  $('updated').textContent = S.updated;
  document.title = 'ITP prose refactor, round ' + S.round;

  var LABEL = {
    building: 'Builder running',
    reviewing: 'Critic running',
    lost: 'Critic picked theirs',
    won: 'Critic picked ours'
  };

  $('board').innerHTML = S.pieces.map(function (p) {
    var st = S.status[p.id] || { state: 'building', round: S.round };
    var critic = '';
    if (st.verdict) {
      critic += '<span class="note">' + esc(st.verdict) + '</span>';
    }
    if (st.gap) {
      critic += '<span class="gap"><b>Biggest remaining gap</b>' + esc(st.gap) + '</span>';
    }
    if (!critic) { critic = '<span class="note" style="color:var(--on-navy-faint)">Awaiting verdict</span>'; }
    return '<tr>' +
      '<td><span class="piece-title">' + esc(p.title) + '</span><br>' +
        '<span class="piece-file">' + esc(p.file) + '</span></td>' +
      '<td class="scope">' + esc(p.scope) + '</td>' +
      '<td><span class="badge badge--' + esc(st.state) + '">' + esc(LABEL[st.state] || st.state) + '</span>' +
        '<br><span class="rnd">round ' + esc(st.round) + '</span>' +
        (st.note ? '<br><span class="note" style="font-size:var(--t-caption)">' + esc(st.note) + '</span>' : '') + '</td>' +
      '<td>' + critic + '</td>' +
    '</tr>';
  }).join('');

  var counts = { won: 0, lost: 0, building: 0, reviewing: 0 };
  S.pieces.forEach(function (p) {
    var s = (S.status[p.id] || {}).state || 'building';
    counts[s] = (counts[s] || 0) + 1;
  });
  $('tally').innerHTML =
    stat(counts.won + ' / ' + S.pieces.length, 'Pieces the critic picked') +
    stat(counts.building, 'Builders running') +
    stat(counts.reviewing, 'Critics running') +
    stat(counts.lost, 'Sent back to the builder');

  function stat(n, label) {
    return '<div class="stat"><span class="stat__num">' + esc(n) + '</span>' +
           '<span class="stat__label">' + esc(label) + '</span></div>';
  }

  $('links').innerHTML = S.pieces.map(function (p) {
    return '<a class="btn btn--ghost btn--sm" href="../' + esc(p.file) + '">' + esc(p.title) + '</a>';
  }).join('') +
    '<a class="btn btn--ghost btn--sm" href="https://www.apple.com/pl/">Bar · apple.com/pl</a>' +
    '<a class="btn btn--ghost btn--sm" href="https://www.apple.com/">Bar · apple.com</a>' +
    '<a class="btn btn--ghost btn--sm" href="PROSE.md">Prose contract</a>' +
    '<a class="btn btn--ghost btn--sm" href="BRIEF.md">Ground-truth brief</a>';

  $('foundation').innerHTML = S.foundation.map(function (f) {
    return '<li class="found"><span class="found__tick">' + (f.done ? '[x]' : '[ ]') + '</span>' +
      '<span><span class="found__label">' + esc(f.label) + '</span><br>' +
      '<span class="found__detail">' + esc(f.detail) + '</span></span></li>';
  }).join('');

  $('rules').innerHTML = S.rules.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('');

  $('log').innerHTML = S.log.map(function (l) {
    return '<li><time>' + esc(l.t) + '</time><span>' + esc(l.m) + '</span></li>';
  }).join('');

  var M = window.ITP_METRICS;
  if (M) {
    var titleOf = {};
    S.pieces.forEach(function (p) { titleOf[p.file] = p.title; });

    var mrow = function (label, m, cls) {
      var gate = m.pass === undefined ? '·'
        : (m.pass ? '<span class="ok">PASS</span>' : '<span class="bad">FAIL</span>');
      var f = function (v, limit, over) {
        if (limit === undefined) return esc(v);
        return '<span class="' + (over ? 'bad' : 'ok') + '">' + esc(v) + '</span>';
      };
      return '<tr class="' + cls + '"><td>' + esc(label) + '</td>' +
        '<td>' + esc(m.words) + '</td>' +
        '<td>' + f(m.em_per_1k, 3, m.em_per_1k >= 3) + '</td>' +
        '<td>' + esc(m.dash_per_1k) + '</td>' +
        '<td>' + f(m.banned, 0, m.banned > 0) + '</td>' +
        '<td>' + esc(m.soft_per_1k) + '</td>' +
        '<td>' + esc(m.sent_mean) + '</td>' +
        '<td>' + esc(m.sent_sd) + '</td>' +
        '<td>' + esc(m.colon_head_pct) + '</td>' +
        '<td>' + esc(m.top_opener_pct) + '</td>' +
        '<td>' + esc(m.emd === undefined ? '·' : m.emd) + '</td>' +
        '<td>' + gate + '</td></tr>';
    };

    var rows = '';
    Object.keys(M.files).forEach(function (f) {
      rows += mrow(titleOf[f] || f, M.files[f], '');
    });
    rows += mrow('All Polish copy', M.totals.pl, 'total');
    rows += mrow('All English copy', M.totals.en, 'total');
    rows += mrow('apple.com/pl', M.bar.pl, 'bar');
    rows += mrow('apple.com', M.bar.en, 'bar');
    $('metrics').innerHTML = rows;

    $('metric-note').textContent =
      'Em-dashes per thousand words must land under 3. Any clause dash must stay within one '
      + 'of the bar. Banned constructions must be zero. Soft buzzwords must stay under the rate '
      + 'Apple itself writes at. EMD is the distance between our sentence-length histogram and '
      + 'the bar\u2019s, in percentage points, and must sit at 25 or below. Colon% counts headlines '
      + 'shaped Term: explanation. Opener% is the share taken by the single most repeated two-word '
      + 'sentence opening. Run python3 scripts/prose.py js to refresh this table.';
  }
})();
</script>
</body>
</html>
